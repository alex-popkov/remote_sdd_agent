services:
  receiver:
    build: ./receiver
    container_name: remote-agent-receiver
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Shared queue: receiver writes, worker reads.
      - ./workspace/queue:/queue
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./worker
    container_name: remote-agent-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./workspace/queue:/queue
      - ./workspace/runs:/runs
      - ./pipeline:/pipeline:ro
    # Worker depends on receiver only for startup order; it polls the queue
    # independently and survives receiver restarts.
    depends_on:
      - receiver
