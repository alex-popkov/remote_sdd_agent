services:
  receiver:
    build:
      context: .
      dockerfile: receiver/Dockerfile
    container_name: remote-agent-receiver
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Single shared workspace mount — queue/, runs/, and state/ live here.
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: remote-agent-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./workspace:/workspace
      - ./pipeline:/pipeline:ro
    # Worker depends on receiver only for startup order; it polls the queue
    # independently and survives receiver restarts.
    depends_on:
      - receiver